name: Release esphomeair app

on:
    push:
        tags:
            - "esphomeair-v*"

permissions:
    contents: write

jobs:
    release:
        name: Package and publish
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Derive version from tag
              id: ver
              run: |
                  tag="${GITHUB_REF_NAME}"                    # esphomeair-v1.2.3
                  echo "tag=${tag}" >> "$GITHUB_OUTPUT"
                  echo "version=${tag#esphomeair-v}" >> "$GITHUB_OUTPUT"   # 1.2.3

            - name: Stamp version file
              run: echo "${{ steps.ver.outputs.version }}" > esphomeair/version.txt

            - name: Package esphomeair/ directory
              run: |
                  tar -czf "${{ steps.ver.outputs.tag }}.tar.gz" \
                    -C esphomeair .

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  name: "esphomeair app ${{ steps.ver.outputs.tag }}"
                  body: |
                      ESPHome air quality tile for the Toon smart thermostat.
                      Shows CO₂, PM2.5, and fan speed from local ESPHome devices.

                      ### Install / update on device

                      Run the following command **once** over SSH to install or update:

                      ```sh
                      sh /qmf/qml/apps/esphomeair/update.sh
                      ```

                      If the app is not yet installed, download `update.sh` first:

                      ```sh
                      mkdir -p /qmf/qml/apps/esphomeair
                      wget -O /qmf/qml/apps/esphomeair/update.sh \
                        https://raw.githubusercontent.com/luukvisser/toon-weer/main/esphomeair/update.sh
                      sh /qmf/qml/apps/esphomeair/update.sh
                      ```

                      To enable automatic updates at boot, add a cron entry (see `update.sh`).
                  files: "${{ steps.ver.outputs.tag }}.tar.gz"
