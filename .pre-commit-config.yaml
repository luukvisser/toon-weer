repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: check-merge-conflict
          - id: check-added-large-files

    - repo: https://github.com/rbubley/mirrors-prettier
      rev: v3.3.3
      hooks:
          - id: prettier
            files: \.(js|json|md|ya?ml)$

    - repo: local
      hooks:
          - id: qmlformat
            name: qmlformat
            language: system
            entry: /usr/lib/qt6/bin/qmlformat -i
            files: \.qml$

          # qmllint requires Toon-specific QML modules (qb.components, BasicUIControls)
          # that are only present on the device; run manually on the device if needed.
          # - id: qmllint
          #   name: qmllint
          #   language: system
          #   entry: /usr/lib/qt6/bin/qmllint
          #   files: \.qml$
